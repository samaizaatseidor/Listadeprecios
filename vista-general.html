<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vista General del Proyecto · SEIDOR México</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script>
<style>
  :root{
    --navy:#0A1226; --navy2:#0E1E3F; --blue:#1E5BB8;
    --cyan:#33B4DD; --cyan-l:#6FD3F0;
    --ink:#16223A; --grey:#5E6B82; --greyl:#8A97AC;
    --line:#D8E2EE; --card:#F4F8FC;
    --shadow: 0 3px 9px rgba(159,179,204,0.35);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Poppins',"Segoe UI",sans-serif; color:var(--ink); background:var(--card); min-height:100vh;}
  .topnav{background:#fff; border-bottom:1px solid var(--line);}
  .topnav-wrap{max-width:1200px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  .topnav-logo img{height:26px; display:block;}
  .topnav-links{display:flex; gap:24px; flex-wrap:wrap;}
  .topnav-links a{color:var(--navy2); text-decoration:none; font-size:14px; font-weight:500;}
  .topnav-links a:hover{color:var(--blue);}
  .topnav-links a.active{color:var(--blue); border-bottom:2px solid var(--cyan); padding-bottom:2px;}

  header{background:radial-gradient(circle at 85% -10%, var(--blue) 0%, var(--navy2) 45%, var(--navy) 100%); color:#fff; padding:22px 24px;}
  header h1{margin:0 0 4px; font-size:20px; font-weight:600;}
  header p{margin:0 0 14px; color:var(--cyan-l); font-size:13px;}
  .proyecto-selector{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .proyecto-selector select{padding:9px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.08); color:#fff; font-family:inherit; font-size:13.5px; min-width:220px;}
  .proyecto-selector select option{color:#000;}
  .btn{border:none; border-radius:8px; padding:9px 14px; font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;}
  .btn-ghost{background:rgba(255,255,255,0.1); color:#fff; border:1px solid rgba(255,255,255,0.3); text-decoration:none; display:inline-block;}
  .btn-ghost.light{background:#fff; color:var(--grey); border:1px solid var(--line);}

  main{max-width:1000px; margin:0 auto; padding:16px;}
  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px; margin-bottom:16px;}
  .kpi-card{background:#fff; border-radius:12px; padding:14px 16px; box-shadow:var(--shadow);}
  .kpi-card .n{font-size:22px; font-weight:700; color:var(--navy2);}
  .kpi-card .n.warn{color:#B23A3A;}
  .kpi-card .l{font-size:11.5px; color:var(--grey); margin-top:2px;}

  .section{background:#fff; border-radius:12px; padding:16px 18px; margin-bottom:16px; box-shadow:var(--shadow);}
  .section h2{font-size:14px; color:var(--navy2); margin:0 0 8px;}
  .resumen-text{font-size:13.5px; color:var(--ink); line-height:1.6;}
  .resumen-empty{font-size:12.5px; color:var(--greyl);}

  .phase-progress-row{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:12.5px;}
  .phase-progress-row .label{width:180px; flex-shrink:0; color:var(--grey);}
  .phase-progress-row .bar{flex:1; background:var(--card); border-radius:20px; height:8px; overflow:hidden;}
  .phase-progress-row .fill{background:var(--blue); height:100%;}
  .phase-progress-row .pct{width:44px; text-align:right; color:var(--navy2); font-weight:600;}

  .no-proyecto{text-align:center; padding:60px 20px; color:var(--grey);}
  .loading{color:var(--grey); text-align:center; padding:20px;}
  .spinner{display:inline-block; width:12px; height:12px; border:2px solid var(--line); border-top-color:var(--blue); border-radius:50%; animation:spin 0.8s linear infinite; vertical-align:middle; margin-right:6px;}
  @keyframes spin{ to { transform:rotate(360deg); } }
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-wrap">
    <a href="/index.html" class="topnav-logo"><img src="/assets/logo_light.png" alt="SEIDOR"></a>
    <div class="topnav-links">
      <a href="/index.html">Inicio</a>
      <a href="/precios.html">Lista de Precios</a>
      <a href="/pipeline.html">CRM PresalesMX</a>
      <a href="/ficha.html">Ficha del Cliente</a>
      <a href="/kpis.html">Tablero de Control</a>
      <a href="/documentos.html">Documentos de Apoyo</a>
      <a href="/agentes.html" class="active">Agentes powered by DELFOS</a>
    </div>
  </div>
</nav>

<header>
  <h1>Vista General del Proyecto</h1>
  <p>Línea base, KPIs, avance del checklist y resumen ejecutivo maestro — todo en un solo lugar</p>
  <div class="proyecto-selector">
    <select id="proyectoSelect" onchange="selectProyecto(this.value)"><option value="">Selecciona un proyecto...</option></select>
    <a class="btn btn-ghost" id="dashboardLink" href="#" style="display:none;">📐 Dashboard de Proyecto</a>
    <a class="btn btn-ghost" id="checklistLink" href="#" style="display:none;">✅ Checklist</a>
    <button class="btn btn-ghost" id="exportBtn" onclick="exportarPPT()" style="display:none;">📤 Exportar PPT Maestro</button>
  </div>
</header>

<main id="main"><div class="no-proyecto">Cargando…</div></main>

<script>
let proyectos = [];
let currentProyecto = null;
let dash = { raid:[], dependencias:[], compromisos:[], changeRequests:[] };
let lineasBase = {};
let progresoChecklist = {};
let resumenGenerated = false;

const FASES_LABELS = { prepare:'Prepare', explore:'Explore', realize:'Realize', deploy:'Deploy', cutover:'Cutover / Go-Live', run:'Run' };
const FASES_ITEM_COUNTS = { prepare:8, explore:7, realize:7, deploy:7, cutover:11, run:7 };

function esc(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&lt;','<':'&lt;','>':'&gt;'}[c])); }

async function loadAll(){
  try{
    const r = await fetch('/api/proyecto-dashboard');
    const d = await r.json();
    proyectos = d.proyectos || [];
    dash = { raid:d.raid||[], dependencias:d.dependencias||[], compromisos:d.compromisos||[], changeRequests:d.changeRequests||[] };
  }catch(e){}
  try{
    const r2 = await fetch('/api/linea-base');
    const d2 = await r2.json();
    lineasBase = d2.proyectos || {};
  }catch(e){}
  try{
    const r3 = await fetch('/api/checklist');
    const d3 = await r3.json();
    progresoChecklist = d3.progreso || {};
  }catch(e){}

  populateSelect();
  const urlParams = new URLSearchParams(window.location.search);
  const fromUrl = urlParams.get('proyecto');
  if(fromUrl && proyectos.includes(fromUrl)) selectProyecto(fromUrl);
  else if(proyectos.length) selectProyecto(proyectos[0]);
  else render();
}

function populateSelect(){
  const sel = document.getElementById('proyectoSelect');
  sel.innerHTML = '<option value="">Selecciona un proyecto...</option>' + proyectos.map(p=>`<option value="${esc(p)}" ${p===currentProyecto?'selected':''}>${esc(p)}</option>`).join('');
}

function selectProyecto(p){
  currentProyecto = p || null;
  resumenGenerated = false;
  document.getElementById('proyectoSelect').value = p || '';
  render();
}

function itemsFor(kind){ return dash[kind].filter(it=>it.proyecto===currentProyecto); }

function isPastDue(fecha, estatus, doneStatus){
  if(!fecha || estatus === doneStatus) return false;
  return new Date(fecha+'T00:00:00') < new Date(new Date().toDateString());
}

function checklistSummaryForProyecto(){
  const prog = progresoChecklist[currentProyecto] || {};
  return Object.keys(FASES_ITEM_COUNTS).map(faseId=>{
    const total = FASES_ITEM_COUNTS[faseId];
    const faseProg = prog[faseId] || {};
    const completados = Object.values(faseProg).filter(x=>x && x.checked).length;
    return { fase: FASES_LABELS[faseId], completados, total, pct: Math.round(completados/total*100) };
  });
}

function computeKPIs(){
  const raid = itemsFor('raid');
  const deps = itemsFor('dependencias');
  const coms = itemsFor('compromisos');
  const crs = itemsFor('changeRequests');
  const checklistData = checklistSummaryForProyecto();
  const checklistTotalCompletados = checklistData.reduce((s,f)=>s+f.completados,0);
  const checklistTotalItems = checklistData.reduce((s,f)=>s+f.total,0);

  return {
    riesgosAltoAbiertos: raid.filter(it=>it.tipo==='Riesgo' && it.prioridad==='Alta' && it.estatus!=='Cerrado').length,
    depsBloqueando: deps.filter(it=>it.estatus==='Bloqueando').length,
    comsVencidos: coms.filter(it=>isPastDue(it.fechaLimite, it.estatus, 'Cumplido')).length,
    crsPendientes: crs.filter(it=>it.estatus==='Solicitada' || it.estatus==='En análisis').length,
    checklistPct: checklistTotalItems ? Math.round(checklistTotalCompletados/checklistTotalItems*100) : 0,
    checklistData
  };
}

function render(){
  const main = document.getElementById('main');
  const exportBtn = document.getElementById('exportBtn');
  const dashboardLink = document.getElementById('dashboardLink');
  const checklistLink = document.getElementById('checklistLink');

  if(!currentProyecto){
    main.innerHTML = '<div class="no-proyecto">Selecciona un proyecto para ver su vista general (créalo primero desde Iniciar Proyecto o el Dashboard de Proyecto).</div>';
    exportBtn.style.display = 'none';
    dashboardLink.style.display = 'none';
    checklistLink.style.display = 'none';
    return;
  }

  exportBtn.style.display = 'inline-block';
  dashboardLink.style.display = 'inline-block';
  dashboardLink.href = '/proyecto.html?proyecto=' + encodeURIComponent(currentProyecto);
  checklistLink.style.display = 'inline-block';
  checklistLink.href = '/checklist.html?proyecto=' + encodeURIComponent(currentProyecto);

  const k = computeKPIs();
  const lb = lineasBase[currentProyecto];

  main.innerHTML = `
    ${lb ? `
      <details style="background:#fff; border-radius:12px; padding:14px 18px; margin-bottom:16px; box-shadow:var(--shadow);" open>
        <summary style="cursor:pointer; font-size:13px; font-weight:600; color:var(--navy2);">📐 Línea Base del Proyecto (SOW/DDA)</summary>
        <div style="margin-top:12px; font-size:12.5px; color:var(--ink); line-height:1.6;">
          ${lb.clienteNombre ? `<div><b>Cliente:</b> ${esc(lb.clienteNombre)}</div>` : ''}
          ${lb.alcanceResumen ? `<div style="margin-top:8px;"><b>Alcance:</b> ${esc(lb.alcanceResumen)}</div>` : ''}
          ${lb.inversionTotal ? `<div style="margin-top:8px;"><b>Inversión total:</b> ${esc(lb.inversionTotal)} ${esc(lb.moneda||'')}</div>` : ''}
          ${lb.fueraDeAlcance && lb.fueraDeAlcance.length ? `<div style="margin-top:8px;"><b>Fuera de alcance:</b><ul style="margin:4px 0 0; padding-left:18px;">${lb.fueraDeAlcance.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
        </div>
      </details>
    ` : `<div class="section"><p class="resumen-empty">Este proyecto no tiene Línea Base — créala subiendo el SOW/DDA en "Iniciar Proyecto desde SOW/DDA".</p></div>`}

    <div class="kpi-grid">
      <div class="kpi-card"><div class="n ${k.riesgosAltoAbiertos?'warn':''}">${k.riesgosAltoAbiertos}</div><div class="l">Riesgos altos abiertos</div></div>
      <div class="kpi-card"><div class="n ${k.depsBloqueando?'warn':''}">${k.depsBloqueando}</div><div class="l">Dependencias bloqueando</div></div>
      <div class="kpi-card"><div class="n ${k.comsVencidos?'warn':''}">${k.comsVencidos}</div><div class="l">Compromisos vencidos</div></div>
      <div class="kpi-card"><div class="n ${k.crsPendientes?'warn':''}">${k.crsPendientes}</div><div class="l">Change Requests pendientes</div></div>
      <div class="kpi-card"><div class="n">${k.checklistPct}%</div><div class="l">Avance Checklist (Quality Gates)</div></div>
    </div>

    <div class="section">
      <h2>Avance por fase (Checklist)</h2>
      ${k.checklistData.map(f=>`
        <div class="phase-progress-row">
          <div class="label">${esc(f.fase)}</div>
          <div class="bar"><div class="fill" style="width:${f.pct}%;"></div></div>
          <div class="pct">${f.pct}%</div>
        </div>
      `).join('')}
    </div>

    <div class="section">
      <h2>Resumen ejecutivo maestro</h2>
      <div id="resumenContent" class="resumen-empty">Sin generar todavía.</div>
      <button class="btn btn-ghost light" style="margin-top:10px;" onclick="generarResumen()">Generar resumen ejecutivo maestro</button>
    </div>
  `;
}

async function generarResumen(){
  const box = document.getElementById('resumenContent');
  box.textContent = 'Generando…';
  resumenGenerated = false;
  try{
    const r = await fetch('/api/resumen-general', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        proyecto: currentProyecto,
        lineaBase: lineasBase[currentProyecto] || {},
        raid: itemsFor('raid'),
        dependencias: itemsFor('dependencias'),
        compromisos: itemsFor('compromisos'),
        changeRequests: itemsFor('changeRequests'),
        checklist: computeKPIs().checklistData
      })
    });
    const d = await r.json();
    if(!d.ok){ box.innerHTML = `<span style="color:#B23A3A;">${esc(d.error||'No se pudo generar.')}</span>`; return; }
    box.className = 'resumen-text';
    box.textContent = d.resumen;
    resumenGenerated = true;
  }catch(e){
    box.innerHTML = '<span style="color:#B23A3A;">No se pudo conectar con Delfos.</span>';
  }
}

async function exportarPPT(){
  const NAVY='0A1226', NAVY2='0E1E3F', BLUE='1E5BB8', CYAN='33B4DD', INK='16223A', LINE='D8E2EE';
  const k = computeKPIs();
  const lb = lineasBase[currentProyecto];
  const raidVis = itemsFor('raid').filter(it=>it.visibleCliente);
  const depsVis = itemsFor('dependencias').filter(it=>it.visibleCliente);
  const comsVis = itemsFor('compromisos').filter(it=>it.visibleCliente);
  const crVis = itemsFor('changeRequests').filter(it=>it.visibleCliente);

  const pptx = new PptxGenJS();
  pptx.defineLayout({ name:'SEIDOR', width:13.333, height:7.5 });
  pptx.layout = 'SEIDOR';

  let logoDataUrl = null;
  try{
    const resp = await fetch('/assets/logo_dark.png');
    const blob = await resp.blob();
    logoDataUrl = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(blob); });
  }catch(e){}

  let slide = pptx.addSlide();
  slide.background = { color: NAVY };
  if(logoDataUrl) slide.addImage({ data: logoDataUrl, x:0.6, y:0.5, w:1.8, h:0.6 });
  slide.addText('Reporte General del Proyecto', { x:0.6, y:2.6, w:12, h:0.8, fontSize:30, bold:true, color:'FFFFFF', fontFace:'Arial' });
  slide.addText(currentProyecto, { x:0.6, y:3.4, w:12, h:0.6, fontSize:20, color:CYAN, fontFace:'Arial' });
  if(lb && lb.clienteNombre) slide.addText(lb.clienteNombre, { x:0.6, y:4.0, w:12, h:0.5, fontSize:14, color:'8A97AC', fontFace:'Arial' });
  slide.addText(new Date().toLocaleDateString('es-MX', { year:'numeric', month:'long', day:'numeric' }), { x:0.6, y:4.5, w:12, h:0.5, fontSize:13, color:'8A97AC', fontFace:'Arial' });

  function header(s, title){
    s.background = { color:'FFFFFF' };
    s.addShape('rect', { x:0, y:0, w:13.333, h:0.9, fill:{color:NAVY} });
    if(logoDataUrl) s.addImage({ data: logoDataUrl, x:11.3, y:0.15, w:1.6, h:0.55 });
    s.addText(title, { x:0.5, y:0.15, w:9, h:0.6, fontSize:18, bold:true, color:'FFFFFF', fontFace:'Arial' });
  }

  if(resumenGenerated){
    slide = pptx.addSlide();
    header(slide, 'Resumen Ejecutivo Maestro');
    slide.addText(document.getElementById('resumenContent').textContent, { x:0.6, y:1.4, w:12, h:4, fontSize:15, color:INK, fontFace:'Arial', valign:'top' });
  }

  if(lb){
    slide = pptx.addSlide();
    header(slide, 'Línea Base del Proyecto');
    let y = 1.4;
    if(lb.alcanceResumen){ slide.addText('Alcance: '+lb.alcanceResumen, { x:0.6, y, w:12, h:1.2, fontSize:13, color:INK, fontFace:'Arial', valign:'top' }); y += 1.4; }
    if(lb.inversionTotal){ slide.addText('Inversión total: '+lb.inversionTotal+' '+(lb.moneda||''), { x:0.6, y, w:12, h:0.4, fontSize:13, color:INK, fontFace:'Arial' }); y += 0.6; }
    if(lb.fueraDeAlcance && lb.fueraDeAlcance.length){
      slide.addText('Fuera de alcance: '+lb.fueraDeAlcance.join(' · '), { x:0.6, y, w:12, h:2, fontSize:12, color:INK, fontFace:'Arial', valign:'top' });
    }
  }

  slide = pptx.addSlide();
  header(slide, 'Avance de Checklist (Quality Gates)');
  const crows = [[
    { text:'Fase', options:{ bold:true, color:'FFFFFF', fill:{color:NAVY2} } },
    { text:'Completados', options:{ bold:true, color:'FFFFFF', fill:{color:NAVY2} } },
    { text:'% Avance', options:{ bold:true, color:'FFFFFF', fill:{color:NAVY2} } }
  ]];
  k.checklistData.forEach(f=>crows.push([f.fase, `${f.completados} / ${f.total}`, `${f.pct}%`]));
  slide.addTable(crows, { x:0.5, y:1.3, w:8, colW:[4,2,2], fontSize:12, color:INK, border:{type:'solid', color:LINE, pt:0.5} });

  if(raidVis.length){
    slide = pptx.addSlide();
    header(slide, 'Riesgos, Issues, Acciones y Decisiones');
    const rows = [[{text:'Tipo',options:{bold:true,color:'FFFFFF',fill:{color:NAVY2}}},{text:'Descripción',options:{bold:true,color:'FFFFFF',fill:{color:NAVY2}}},{text:'Estatus',options:{bold:true,color:'FFFFFF',fill:{color:NAVY2}}}]];
    raidVis.forEach(it=>rows.push([it.tipo, it.descripcion, it.estatus]));
    slide.addTable(rows, { x:0.5, y:1.3, w:12.3, colW:[1.8,8.5,2], fontSize:11, color:INK, border:{type:'solid', color:LINE, pt:0.5}, autoPage:true });
  }
  if(depsVis.length){
    slide = pptx.addSlide();
    header(slide, 'Dependencias Críticas');
    const rows = [[{text:'Depende de',options:{bold:true,color:'FFFFFF',fill:{color:NAVY2}}},{text:'Descripción',options:{bold:true,color:'FFFFFF',fill:{color:NAVY2}}},{text:'Estatus',options:{bold:true,color:'FFFFFF',fill:{color:NAVY2}}}]];
    depsVis.forEach(it=>rows.push([it.tercero, it.descripcion, it.estatus]));
    slide.addTable(rows, { x:0.5, y:1.3, w:12.3, colW:[2.5,7.8,2], fontSize:11, color:INK, border:{type:'solid', color:LINE, pt:0.5}, autoPage:true });
  }
  if(comsVis.length){
    slide = pptx.addSlide();
    header(slide, 'Compromisos');
    const rows = [[{text:'Quién',options:{bold:true,color:'FFFFFF',fill:{color:NAVY2}}},{text:'Compromiso',options:{bold:true,color:'FFFFFF',fill:{color:NAVY2}}},{text:'Estatus',options:{bold:true,color:'FFFFFF',fill:{color:NAVY2}}}]];
    comsVis.forEach(it=>rows.push([it.quien, it.compromiso, it.estatus]));
    slide.addTable(rows, { x:0.5, y:1.3, w:12.3, colW:[2.5,7.8,2], fontSize:11, color:INK, border:{type:'solid', color:LINE, pt:0.5}, autoPage:true });
  }
  if(crVis.length){
    slide = pptx.addSlide();
    header(slide, 'Change Requests');
    const rows = [[{text:'Título',options:{bold:true,color:'FFFFFF',fill:{color:NAVY2}}},{text:'Impacto',options:{bold:true,color:'FFFFFF',fill:{color:NAVY2}}},{text:'Estatus',options:{bold:true,color:'FFFFFF',fill:{color:NAVY2}}}]];
    crVis.forEach(it=>rows.push([it.titulo, [it.impactoTiempo,it.impactoCosto].filter(Boolean).join(' · ') || '—', it.estatus]));
    slide.addTable(rows, { x:0.5, y:1.3, w:12.3, colW:[5.5,4.8,2], fontSize:11, color:INK, border:{type:'solid', color:LINE, pt:0.5}, autoPage:true });
  }

  pptx.writeFile({ fileName: `Reporte General - ${currentProyecto}.pptx` });
}

loadAll();
</script>
</body>
</html>
