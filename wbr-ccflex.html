<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A1226">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16.png">
<title>WBR — CCFlex · SEIDOR México</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{ --navy:#0A1226; --navy2:#0E1E3F; --blue:#1E5BB8; --cyan:#33B4DD; --cyan-l:#6FD3F0; --ink:#16223A; --grey:#5E6B82; --greyl:#8A97AC; --line:#D8E2EE; --card:#F4F8FC; --green:#1F8A4C; --amber:#D8A63A; --red:#B23A3A; --shadow: 0 3px 9px rgba(159,179,204,0.35); }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Poppins',"Segoe UI",sans-serif; color:var(--ink); background:var(--card); min-height:100vh;}
  .topnav{background:#fff; border-bottom:1px solid var(--line);}
  .topnav-wrap{max-width:none; margin:0; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  .topnav-logo img{height:26px; display:block;}
  .topnav-links{display:flex; gap:4px; align-items:center; flex-wrap:wrap;}
  .nav-link{color:var(--navy2); text-decoration:none; font-size:14px; font-weight:500; padding:8px 8px; border-radius:6px;}
  .nav-dropdown{position:relative;}
  .nav-dropdown-btn{background:none; border:none; font-family:inherit; color:var(--navy2); font-size:14px; font-weight:500; padding:8px 8px; cursor:pointer; display:flex; align-items:center; gap:4px; border-radius:6px;}
  .nav-dropdown-btn.active{color:var(--blue);}
  .nav-dropdown-btn .caret{font-size:10px; margin-top:1px;}
  .nav-dropdown.open .nav-dropdown-btn .caret{transform:rotate(180deg);}
  .nav-dropdown-menu{display:none; position:absolute; top:100%; left:0; margin-top:6px; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 28px rgba(10,18,38,0.14); padding:8px; min-width:240px; z-index:60;}
  .nav-dropdown.open .nav-dropdown-menu{display:block;}
  .nav-dropdown-menu a{display:block; padding:8px 10px; color:var(--navy2); text-decoration:none; font-size:13.5px; border-radius:6px; white-space:nowrap;}
  .nav-dropdown-menu a:hover{background:var(--card); color:var(--blue);}
  .nav-dropdown-menu a.active{color:var(--blue); font-weight:600; background:var(--card);}
  header{background:radial-gradient(circle at 85% -10%, var(--blue) 0%, var(--navy2) 45%, var(--navy) 100%); color:#fff; padding:26px 24px; display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:16px;}
  header h1{margin:0 0 4px; font-size:22px; font-weight:700;}
  header p{margin:0; color:var(--cyan-l); font-size:13px;}
  .fecha-revision{display:inline-block; margin-top:8px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.25); border-radius:20px; padding:5px 14px; font-size:12px; font-weight:600;}
  input[type=file]{display:none;}
  .upload-label{background:rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.35); border-radius:8px; padding:10px 16px; font-size:13.5px; font-weight:600; cursor:pointer; display:inline-block;}
  main{max-width:1400px; margin:0 auto; padding:24px 24px 60px;}
  .section{background:#fff; border-radius:14px; padding:20px 22px; margin-bottom:18px; box-shadow:var(--shadow);}
  .section h2{font-size:15px; color:var(--navy2); margin:0 0 4px;}
  .sub{font-size:12px; color:var(--greyl); margin:0 0 14px;}
  .empty{text-align:center; padding:70px 20px; color:var(--greyl);}
  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:14px; margin-bottom:18px;}
  .kpi-card{background:#fff; border-radius:14px; padding:18px 20px; box-shadow:var(--shadow);}
  .kpi-card .label{font-size:11px; color:var(--greyl); text-transform:uppercase; letter-spacing:0.5px; font-weight:700;}
  .kpi-card .value{font-size:24px; font-weight:800; color:var(--navy2); margin-top:6px;}
  .charts-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .chart-wrap{position:relative; height:260px;}
  @media (max-width:900px){ .charts-grid{grid-template-columns:1fr;} }
  .insight-box{background:linear-gradient(135deg, #F4F8FC 0%, #EAF3FB 100%); border:1px solid var(--line); border-radius:12px; padding:18px 20px; display:flex; gap:14px; align-items:flex-start;}
  .insight-icon{font-size:26px; flex-shrink:0;}
  .insight-text{font-size:13.5px; line-height:1.6; color:var(--ink); white-space:pre-wrap;}
  table{width:100%; border-collapse:collapse; font-size:12px;}
  th{text-align:left; color:var(--grey); border-bottom:1px solid var(--line); padding:6px; font-weight:700; font-size:10px; text-transform:uppercase;}
  td{padding:8px 6px; border-bottom:1px solid var(--line);}
  .num{text-align:right; font-variant-numeric:tabular-nums;}
  .bloque-titulo{font-size:13px; font-weight:700; color:var(--navy2); margin:0 0 8px;}
  .loading{color:var(--grey); font-size:13px; text-align:center; padding:20px;}
  .spinner{display:inline-block; width:12px; height:12px; border:2px solid var(--line); border-top-color:var(--blue); border-radius:50%; animation:spin 0.8s linear infinite; vertical-align:middle; margin-right:6px;}
  @keyframes spin{ to { transform:rotate(360deg); } }
</style>
</head>
<body>
<script>
(async function(){
  const m = location.pathname.match(/\/([a-z0-9-]+)\.html$/i);
  if(!m) return;
  try{
    const r = await fetch('/api/mi-permiso?page=' + m[1]);
    const d = await r.json();
    if(!d.ok) return;
    if(d.permiso === 'ninguno'){
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:#F4F8FC; z-index:99999; display:flex; align-items:center; justify-content:center; flex-direction:column; font-family:Poppins,sans-serif; text-align:center; padding:20px;';
      overlay.innerHTML = '<div style="font-size:40px; margin-bottom:12px;">🔒</div><h2 style="color:#0E1E3F; margin:0 0 8px; font-size:18px;">No tienes acceso a esta página</h2><p style="color:#8A97AC; font-size:13.5px; max-width:380px; margin:0;">Si crees que deberías verla, pide a un Administrador que revise tu rol en Roles y Permisos.</p><a href="/index.html" style="margin-top:16px; color:#1E5BB8; font-weight:600; text-decoration:none; font-size:13.5px;">← Volver al inicio</a>';
      document.body.appendChild(overlay);
      document.body.style.overflow = 'hidden';
    }else if(d.permiso === 'lectura'){
      const banner = document.createElement('div');
      banner.style.cssText = 'background:#FBF1DE; color:#8A6414; font-size:12.5px; font-weight:600; text-align:center; padding:8px 16px;';
      banner.textContent = '👁️ Modo solo lectura — puedes ver esta página pero no guardar cambios';
      document.body.insertBefore(banner, document.body.firstChild);
    }
  }catch(e){}
})();
</script>

<header>
  <div>
    <h1>💳 Weekly Business Review — CCFlex</h1>
    <p>Ventas y cobranza del programa CCFlex — C&S vs. A&O, con insights de Delfos</p>
    <div id="fechaRevisionBadge"></div>
  </div>
  <label class="upload-label" for="fileInput">⬆️ Subir corte de esta semana</label>
  <input type="file" id="fileInput" accept=".xlsx,.xls" onchange="handleFile(this.files[0])">
</header>

<main>
  <div id="statusBox"></div>
  <div id="content"></div>
</main>

<script>
let historial = [];
let actual = null;
let chartCS, chartAO;

function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g, c=>({'&':'&lt;','<':'&lt;','>':'&gt;'}[c])); }
function fmtMoneda(n){ return n==null ? '—' : '$'+Math.round(n).toLocaleString('es-MX'); }
function encontrarFila(m, ancla){ for(let i=0;i<m.length;i++){ if(m[i].some(c=>typeof c==='string' && c.trim().toUpperCase()===ancla.toUpperCase())) return i; } return -1; }

function parsearCCFlex(wb){
  const ws = wb.Sheets['CCFLEX'] || wb.Sheets['CCFlex'];
  if(!ws) throw new Error('No se encontró una pestaña "CCFLEX"');
  const m = XLSX.utils.sheet_to_json(ws, { header:1, defval:null, raw:true });
  const idxHeader = encontrarFila(m, 'Concepto');
  function leerBloque(offsetCol){
    const filas = [];
    for(let i=idxHeader+1; i<m.length; i++){
      const f = m[i];
      if(!f || f[offsetCol]==null) continue;
      filas.push({ concepto:f[offsetCol], aa:f[offsetCol+1]||0, q1:f[offsetCol+2]||0, q2:f[offsetCol+3]||0, q3:f[offsetCol+4]||0, q4:f[offsetCol+5]||0, total:f[offsetCol+6]||0 });
    }
    return filas;
  }
  return { fechaRevision: new Date().toISOString(), cs: leerBloque(0), ao: leerBloque(8) };
}

async function handleFile(file){
  if(!file) return;
  const statusBox = document.getElementById('statusBox');
  statusBox.innerHTML = '<div class="loading"><span class="spinner"></span>Leyendo el archivo…</div>';
  try{
    if(typeof XLSX === 'undefined') throw new Error('No se pudo cargar la librería de Excel.');
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    actual = parsearCCFlex(wb);
    // Usamos la fecha del nombre del archivo o la de hoy, ya que esta pestaña no trae "Semana de revisión" propia
    statusBox.innerHTML = '<div class="loading"><span class="spinner"></span>Guardando…</div>';
    const anterior = historial.length ? historial[historial.length-1] : null;
    await fetch('/api/wbr-ccflex', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ snapshot: actual }) });
    await cargarHistorial();
    render();
    pedirInsight(anterior);
    statusBox.innerHTML = '<div style="color:#1F8A4C; font-size:13px;">Corte guardado.</div>';
  }catch(e){
    console.error(e);
    statusBox.innerHTML = `<div style="color:#B23A3A; font-size:13px;">No se pudo leer el archivo: ${esc(e.message||String(e))}</div>`;
  }
}
async function cargarHistorial(){
  try{
    const r = await fetch('/api/wbr-ccflex');
    const d = await r.json();
    historial = d.historial || [];
    if(historial.length) actual = historial[historial.length-1];
  }catch(e){ historial = []; }
}
async function pedirInsight(anterior){
  const box = document.getElementById('insightBox');
  if(!box) return;
  box.innerHTML = '<div class="loading"><span class="spinner"></span>Delfos está analizando el corte…</div>';
  try{
    const r = await fetch('/api/wbr-ccflex-insight', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ actual, anterior }) });
    const d = await r.json();
    box.innerHTML = d.ok
      ? `<div class="insight-box"><div class="insight-icon">🤖</div><div class="insight-text">${esc(d.resumen)}</div></div>`
      : `<div class="insight-box"><div class="insight-icon">⚠️</div><div class="insight-text">${esc(d.error||'No se pudo generar el insight.')}</div></div>`;
  }catch(e){
    box.innerHTML = '<div class="insight-box"><div class="insight-icon">⚠️</div><div class="insight-text">No se pudo conectar con Delfos.</div></div>';
  }
}

function tablaBloque(filas){
  return `<table><tr><th>Concepto</th><th class="num">AA</th><th class="num">Q1</th><th class="num">Q2</th><th class="num">Q3</th><th class="num">Q4</th><th class="num">Total</th></tr>
    ${filas.map(f=>`<tr><td>${esc(f.concepto)}</td><td class="num">${fmtMoneda(f.aa)}</td><td class="num">${fmtMoneda(f.q1)}</td><td class="num">${fmtMoneda(f.q2)}</td><td class="num">${fmtMoneda(f.q3)}</td><td class="num">${fmtMoneda(f.q4)}</td><td class="num"><b>${fmtMoneda(f.total)}</b></td></tr>`).join('')}
  </table>`;
}

function render(){
  const content = document.getElementById('content');
  const badge = document.getElementById('fechaRevisionBadge');
  if(!actual){
    badge.innerHTML = '';
    content.innerHTML = `<div class="section"><div class="empty"><h2>Todavía no hay ningún corte cargado</h2><p>Sube el Excel semanal (con la pestaña "CCFLEX") para generar el primer dashboard.</p></div></div>`;
    return;
  }
  badge.innerHTML = `<span class="fecha-revision">Última carga: ${new Date(actual.fechaRevision).toLocaleDateString('es-MX', {day:'numeric', month:'long', year:'numeric'})}</span>`;

  const ventaCS = (actual.cs.find(f=>f.concepto==='Monto Vendido')||{}).total || 0;
  const ventaAO = (actual.ao.find(f=>f.concepto==='Monto Vendido')||{}).total || 0;
  const pendCS = (actual.cs.find(f=>f.concepto.includes('Pend.'))||{}).total || 0;
  const pendAO = (actual.ao.find(f=>f.concepto.includes('Pend.'))||{}).total || 0;

  content.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card"><div class="label">Monto vendido C&S (TCV)</div><div class="value">${fmtMoneda(ventaCS)}</div></div>
      <div class="kpi-card"><div class="label">Monto vendido A&O (TCV)</div><div class="value">${fmtMoneda(ventaAO)}</div></div>
      <div class="kpi-card"><div class="label">Pendiente de SAP a SEIDOR (C&S)</div><div class="value">${fmtMoneda(pendCS)}</div></div>
      <div class="kpi-card"><div class="label">Pendiente de SAP a SEIDOR (A&O)</div><div class="value">${fmtMoneda(pendAO)}</div></div>
    </div>

    <div class="section">
      <h2>🤖 Insight de Delfos</h2>
      <div id="insightBox"><div class="loading">Generando…</div></div>
    </div>

    <div class="section">
      <h2>Ventas por trimestre</h2>
      <div class="charts-grid">
        <div class="chart-wrap"><canvas id="chartCS"></canvas></div>
        <div class="chart-wrap"><canvas id="chartAO"></canvas></div>
      </div>
    </div>

    <div class="section">
      <p class="bloque-titulo">C&S</p>
      ${tablaBloque(actual.cs)}
    </div>
    <div class="section">
      <p class="bloque-titulo">A&O</p>
      ${tablaBloque(actual.ao)}
    </div>

    <div class="section">
      <h2>📅 Bitácora de cortes</h2>
      <table>
        <tr><th>Fecha de carga</th><th class="num">Vendido C&S</th><th class="num">Vendido A&O</th></tr>
        ${historial.slice().reverse().map(h => {
          const vcs = (h.cs.find(f=>f.concepto==='Monto Vendido')||{}).total || 0;
          const vao = (h.ao.find(f=>f.concepto==='Monto Vendido')||{}).total || 0;
          return `<tr><td>${new Date(h.fechaRevision).toLocaleDateString('es-MX')}</td><td class="num">${fmtMoneda(vcs)}</td><td class="num">${fmtMoneda(vao)}</td></tr>`;
        }).join('')}
      </table>
    </div>
  `;
  renderCharts();
}

function renderCharts(){
  if(chartCS) chartCS.destroy();
  if(chartAO) chartAO.destroy();
  const venta = (bloque,concepto) => (bloque.find(f=>f.concepto===concepto)||{});
  const vCS = venta(actual.cs, 'Monto Vendido');
  const vAO = venta(actual.ao, 'Monto Vendido');
  chartCS = new Chart(document.getElementById('chartCS'), {
    type:'bar',
    data:{ labels:['Q1','Q2','Q3','Q4'], datasets:[{ label:'C&S — Monto Vendido', data:[vCS.q1,vCS.q2,vCS.q3,vCS.q4], backgroundColor:'#1E5BB8' }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ title:{display:true, text:'C&S por trimestre'} } }
  });
  chartAO = new Chart(document.getElementById('chartAO'), {
    type:'bar',
    data:{ labels:['Q1','Q2','Q3','Q4'], datasets:[{ label:'A&O — Monto Vendido', data:[vAO.q1,vAO.q2,vAO.q3,vAO.q4], backgroundColor:'#33B4DD' }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ title:{display:true, text:'A&O por trimestre'} } }
  });
}

async function init(){
  await cargarHistorial();
  render();
  if(actual) pedirInsight(historial.length > 1 ? historial[historial.length-2] : null);
}
init();
</script>
<script>
(function(){
  document.querySelectorAll('.nav-dropdown-btn').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var dd = btn.closest('.nav-dropdown');
      var wasOpen = dd.classList.contains('open');
      document.querySelectorAll('.nav-dropdown.open').forEach(function(d){ d.classList.remove('open'); });
      if(!wasOpen) dd.classList.add('open');
    });
  });
  document.addEventListener('click', function(){
    document.querySelectorAll('.nav-dropdown.open').forEach(function(d){ d.classList.remove('open'); });
  });
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  });
}
</script>
</body>
