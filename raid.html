<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora RAID · SEIDOR México</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A1226; --navy2:#0E1E3F; --blue:#1E5BB8;
    --cyan:#33B4DD; --cyan-l:#6FD3F0;
    --ink:#16223A; --grey:#5E6B82; --greyl:#8A97AC;
    --line:#D8E2EE; --card:#F4F8FC;
    --shadow: 0 3px 9px rgba(159,179,204,0.35);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Poppins',"Segoe UI",sans-serif; color:var(--ink); background:var(--card); min-height:100vh;}
  .topnav{background:#fff; border-bottom:1px solid var(--line);}
  .topnav-wrap{max-width:1200px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  .topnav-logo img{height:26px; display:block;}
  .topnav-links{display:flex; gap:24px; flex-wrap:wrap;}
  .topnav-links a{color:var(--navy2); text-decoration:none; font-size:14px; font-weight:500;}
  .topnav-links a:hover{color:var(--blue);}
  .topnav-links a.active{color:var(--blue); border-bottom:2px solid var(--cyan); padding-bottom:2px;}

  header{background:radial-gradient(circle at 85% -10%, var(--blue) 0%, var(--navy2) 45%, var(--navy) 100%); color:#fff; padding:26px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;}
  header h1{margin:0 0 4px; font-size:20px; font-weight:600;}
  header p{margin:0; color:var(--cyan-l); font-size:13px;}
  .btn{border:none; border-radius:8px; padding:10px 16px; font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--blue); color:#fff;}
  .btn-ghost{background:#fff; color:var(--grey); border:1px solid var(--line);}
  .btn-danger{background:#fff; color:#B23A3A; border:1px solid #E8C7C7;}

  .toolbar{display:flex; gap:8px; padding:14px 16px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .toolbar input[type=text]{flex:1; min-width:140px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:13px; color:var(--ink);}
  .toolbar select{padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:13px; color:var(--ink); background:#fff;}

  main{max-width:1000px; margin:0 auto; padding:16px;}
  .row{background:#fff; border-radius:10px; padding:14px 16px; margin-bottom:10px; box-shadow:var(--shadow); border-left:4px solid var(--line); cursor:pointer;}
  .row.tipo-riesgo{border-left-color:#C24545;}
  .row.tipo-issue{border-left-color:#D9A441;}
  .row.tipo-accion{border-left-color:#1E5BB8;}
  .row.tipo-decision{border-left-color:#2E9E5B;}
  .row-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
  .row h3{margin:0; font-size:14px; color:var(--navy2);}
  .row .proyecto{font-size:11.5px; color:var(--greyl);}
  .row p{margin:6px 0 0; font-size:13px; color:var(--ink);}
  .tags{display:flex; gap:6px; flex-wrap:wrap;}
  .tag{font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:20px;}
  .tag.tipo-riesgo{background:#FBE7E7; color:#B23A3A;}
  .tag.tipo-issue{background:#FBF1DE; color:#8A6414;}
  .tag.tipo-accion{background:#EDF3FA; color:#1E5BB8;}
  .tag.tipo-decision{background:#E7F7EE; color:#1F8A4C;}
  .tag.estatus-abierto{background:#FBE7E7; color:#B23A3A;}
  .tag.estatus-progreso{background:#FBF1DE; color:#8A6414;}
  .tag.estatus-cerrado{background:#E7F7EE; color:#1F8A4C;}
  .row-meta{font-size:11.5px; color:var(--greyl); margin-top:8px;}
  .row-meta .overdue{color:#B23A3A; font-weight:600;}

  .board{display:flex; gap:14px; overflow-x:auto;}
  .col{background:#EDF3FA; border-radius:12px; min-width:280px; max-width:320px; flex-shrink:0; padding:10px;}
  .col h2{font-size:12px; text-transform:none; color:var(--grey); margin:2px 4px 10px; display:flex; justify-content:space-between; font-weight:600;}
  .col h2 .count{background:#fff; color:var(--grey); border-radius:20px; padding:1px 8px; font-size:11px;}
  .col .row{margin-bottom:9px;}

  .empty{color:var(--greyl); font-size:13px; text-align:center; padding:30px;}
  .loading{color:var(--grey); text-align:center; padding:30px;}

  .overlay{display:none; position:fixed; inset:0; background:rgba(10,18,38,0.45); z-index:20; align-items:flex-end; justify-content:center;}
  .overlay.open{display:flex;}
  .sheet{background:#fff; width:100%; max-width:480px; border-radius:16px 16px 0 0; padding:20px; max-height:88vh; overflow-y:auto;}
  .sheet label{display:block; font-size:11.5px; color:var(--grey); margin:14px 0 5px; font-weight:500;}
  .sheet label:first-of-type{margin-top:4px;}
  .sheet input[type=text], .sheet input[type=date], .sheet select, .sheet textarea{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:13.5px; color:var(--ink); resize:vertical;
  }
  .sheet-title{font-size:16px; font-weight:600; color:var(--navy2); margin:0;}
  .sheet-row{display:flex; gap:8px;}
  .sheet-row > div{flex:1;}
  .sheet-actions{display:flex; gap:8px; margin-top:20px;}
  .close-x{float:right; background:none; border:none; font-size:20px; color:var(--greyl); cursor:pointer; line-height:1;}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-wrap">
    <a href="/index.html" class="topnav-logo"><img src="/assets/logo_light.png" alt="SEIDOR"></a>
    <div class="topnav-links">
      <a href="/index.html">Inicio</a>
      <a href="/precios.html">Lista de Precios</a>
      <a href="/pipeline.html">CRM PresalesMX</a>
      <a href="/ficha.html">Ficha del Cliente</a>
      <a href="/kpis.html">Tablero de Control</a>
      <a href="/documentos.html">Documentos de Apoyo</a>
      <a href="/agentes.html" class="active">Agentes powered by DELFOS</a>
    </div>
  </div>
</nav>

<header>
  <div>
    <h1>Bitácora RAID</h1>
    <p>Riesgos, Issues, Acciones y Decisiones de tus proyectos</p>
  </div>
  <button class="btn btn-primary" onclick="openSheet(null)">+ Nuevo</button>
</header>

<div class="toolbar">
  <input type="text" id="search" placeholder="Buscar por proyecto o descripción…">
  <select id="filterProyecto"><option value="">Todos los proyectos</option></select>
  <select id="filterTipo"><option value="">Todos los tipos</option><option value="Riesgo">Riesgo</option><option value="Issue">Issue</option><option value="Acción">Acción</option><option value="Decisión">Decisión</option></select>
  <button class="btn btn-danger" onclick="clearAll()">Borrar todo</button>
</div>

<main id="main"><div class="loading">Cargando…</div></main>

<div class="overlay" id="overlay" onclick="if(event.target===this) closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<script>
let items = [];
let currentId = null;

function esc(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&lt;','<':'&lt;','>':'&gt;'}[c])); }
function tipoClass(t){ return {'Riesgo':'tipo-riesgo','Issue':'tipo-issue','Acción':'tipo-accion','Decisión':'tipo-decision'}[t] || ''; }
function estatusClass(e){ return {'Abierto':'estatus-abierto','En progreso':'estatus-progreso','Cerrado':'estatus-cerrado'}[e] || ''; }

async function loadItems(){
  try{
    const r = await fetch('/api/raid');
    const data = await r.json();
    items = data.items || [];
  }catch(e){ items = []; }
  render();
}

async function saveItems(){
  try{ await fetch('/api/raid', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(items) }); }
  catch(e){ console.error(e); }
}

const ESTATUS_COLS = ['Abierto','En progreso','Cerrado'];
const PRIORIDAD_ORDER = { 'Alta':0, 'Media':1, 'Baja':2 };

function isOverdue(it){
  if(!it.fechaLimite || it.estatus === 'Cerrado') return false;
  return new Date(it.fechaLimite+'T00:00:00') < new Date(new Date().toDateString());
}

function populateProyectoFilter(){
  const sel = document.getElementById('filterProyecto');
  const current = sel.value;
  const proyectos = Array.from(new Set(items.map(it=>it.proyecto).filter(Boolean))).sort();
  sel.innerHTML = '<option value="">Todos los proyectos</option>' + proyectos.map(p=>`<option value="${esc(p)}" ${p===current?'selected':''}>${esc(p)}</option>`).join('');
}

function render(){
  populateProyectoFilter();
  const q = document.getElementById('search').value.trim().toLowerCase();
  const tipoF = document.getElementById('filterTipo').value;
  const proyectoF = document.getElementById('filterProyecto').value;
  const main = document.getElementById('main');

  const visible = items.filter(it=>{
    if(tipoF && it.tipo !== tipoF) return false;
    if(proyectoF && it.proyecto !== proyectoF) return false;
    if(!q) return true;
    return (it.proyecto+' '+it.descripcion).toLowerCase().includes(q);
  });

  if(!items.length){ main.innerHTML = '<div class="empty">Sin registros — crea el primero con "+ Nuevo".</div>'; return; }

  main.innerHTML = `<div class="board">${ESTATUS_COLS.map(estatus=>{
    const colItems = visible.filter(it=>it.estatus===estatus).sort((a,b)=>{
      const p = (PRIORIDAD_ORDER[a.prioridad]??1) - (PRIORIDAD_ORDER[b.prioridad]??1);
      if(p !== 0) return p;
      if(a.fechaLimite && b.fechaLimite) return a.fechaLimite.localeCompare(b.fechaLimite);
      if(a.fechaLimite) return -1;
      if(b.fechaLimite) return 1;
      return new Date(b.createdAt) - new Date(a.createdAt);
    });
    return `
      <div class="col">
        <h2>${estatus} <span class="count">${colItems.length}</span></h2>
        ${colItems.length ? colItems.map(it=>{
          const overdue = isOverdue(it);
          return `
            <div class="row ${tipoClass(it.tipo)}" onclick="openSheet('${it.id}')">
              <div class="row-top">
                <div>
                  <div class="proyecto">${esc(it.proyecto)}</div>
                  <h3>${esc(it.descripcion.slice(0,80))}${it.descripcion.length>80?'…':''}</h3>
                </div>
                <div class="tags">
                  <span class="tag ${tipoClass(it.tipo)}">${esc(it.tipo)}</span>
                </div>
              </div>
              <div class="row-meta">
                ${it.responsable ? esc(it.responsable) : 'Sin responsable'}
                ${it.fechaLimite ? ' · ' + (overdue ? '<span class="overdue">Venció '+new Date(it.fechaLimite+'T00:00:00').toLocaleDateString('es-MX')+'</span>' : 'Vence '+new Date(it.fechaLimite+'T00:00:00').toLocaleDateString('es-MX')) : ''}
                ${it.prioridad ? ' · '+esc(it.prioridad) : ''}
              </div>
            </div>
          `;
        }).join('') : '<div class="empty" style="padding:14px 6px;">Sin registros</div>'}
      </div>
    `;
  }).join('')}</div>`;
}

function openSheet(id){
  currentId = id;
  const it = id ? items.find(x=>x.id===id) : { proyecto:'', tipo:'Riesgo', descripcion:'', responsable:'', fechaLimite:'', prioridad:'Media', estatus:'Abierto' };
  const sheet = document.getElementById('sheet');
  const tipoOpts = ['Riesgo','Issue','Acción','Decisión'].map(t=>`<option value="${t}" ${it.tipo===t?'selected':''}>${t}</option>`).join('');
  const prioOpts = ['Alta','Media','Baja'].map(p=>`<option value="${p}" ${it.prioridad===p?'selected':''}>${p}</option>`).join('');
  const estatusOpts = ['Abierto','En progreso','Cerrado'].map(e=>`<option value="${e}" ${it.estatus===e?'selected':''}>${e}</option>`).join('');

  sheet.innerHTML = `
    <button class="close-x" onclick="closeSheet()">&times;</button>
    <p class="sheet-title">${id ? 'Editar registro' : 'Nuevo registro'}</p>

    <label>Proyecto</label>
    <input type="text" id="f-proyecto" value="${esc(it.proyecto)}" placeholder="Ej. Doga México">

    <div class="sheet-row">
      <div><label>Tipo</label><select id="f-tipo">${tipoOpts}</select></div>
      <div><label>Prioridad</label><select id="f-prioridad">${prioOpts}</select></div>
    </div>

    <label>Descripción</label>
    <textarea id="f-descripcion" rows="3">${esc(it.descripcion)}</textarea>

    <div class="sheet-row">
      <div><label>Responsable</label><input type="text" id="f-responsable" value="${esc(it.responsable)}"></div>
      <div><label>Fecha límite</label><input type="date" id="f-fechaLimite" value="${it.fechaLimite||''}"></div>
    </div>

    <label>Estatus</label>
    <select id="f-estatus">${estatusOpts}</select>

    <div class="sheet-actions">
      <button class="btn btn-primary" onclick="saveItem()">Guardar</button>
      ${id ? '<button class="btn btn-danger" onclick="deleteItem()">Eliminar</button>' : ''}
    </div>
  `;
  document.getElementById('overlay').classList.add('open');
}

function closeSheet(){ document.getElementById('overlay').classList.remove('open'); currentId = null; }

async function saveItem(){
  const proyecto = document.getElementById('f-proyecto').value.trim();
  const descripcion = document.getElementById('f-descripcion').value.trim();
  if(!proyecto || !descripcion){ alert('Ponle al menos proyecto y descripción'); return; }

  const existing = currentId ? items.find(x=>x.id===currentId) : null;
  const data = {
    id: currentId || ('raid-' + Date.now().toString(36)),
    proyecto,
    tipo: document.getElementById('f-tipo').value,
    descripcion,
    responsable: document.getElementById('f-responsable').value.trim(),
    fechaLimite: document.getElementById('f-fechaLimite').value,
    prioridad: document.getElementById('f-prioridad').value,
    estatus: document.getElementById('f-estatus').value,
    createdAt: existing ? existing.createdAt : new Date().toISOString()
  };

  if(currentId){
    const idx = items.findIndex(x=>x.id===currentId);
    items[idx] = data;
  }else{
    items.push(data);
  }
  await saveItems();
  closeSheet();
  render();
}

async function deleteItem(){
  if(!confirm('¿Eliminar este registro?')) return;
  items = items.filter(x=>x.id!==currentId);
  await saveItems();
  closeSheet();
  render();
}

async function clearAll(){
  if(!confirm('Esto borra TODA la bitácora RAID para el equipo. ¿Continuar?')) return;
  items = [];
  await saveItems();
  render();
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('filterTipo').addEventListener('change', render);
document.getElementById('filterProyecto').addEventListener('change', render);
loadItems();
</script>
</body>
</html>
