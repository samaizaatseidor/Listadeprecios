name = "listadepreciosseidor"
main = "src/worker.js"
compatibility_date = "2026-01-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "PM_KV"
id = "64aaa5613ef240b486f24e02610498cd"

[[r2_buckets]]
binding = "DOCS_BUCKET"
bucket_name = "presalesmx-docs"

[[secrets_store_secrets]]
binding = "RESEND_API_KEY"
store_id = "f63b63e25881480bb743023201203a6a"
secret_name = "RESEND_API_KEY"

[[secrets_store_secrets]]
binding = "DELFOS_API_TOKEN"
store_id = "f63b63e25881480bb743023201203a6a"
secret_name = "DELFOS_API_TOKEN"

[[secrets_store_secrets]]
binding = "HUBSPOT_ACCESS_TOKEN"
store_id = "f63b63e25881480bb743023201203a6a"
secret_name = "HUBSPOT_ACCESS_TOKEN"

[triggers]
crons = ["0 22 * * 5"]

# ---------------------------------------------------------------------
# Ambiente de PRUEBAS — mismo código, Worker y KV completamente aparte.
# Se despliega con: npx wrangler deploy --env staging
# Vive en: listadepreciosseidor-staging.<tu-subdominio>.workers.dev
# ---------------------------------------------------------------------
[env.staging]
name = "listadepreciosseidor-staging"

[[env.staging.kv_namespaces]]
binding = "PM_KV"
id = "a4d188769ed64cadb0dd85e14c6d4f6e"

[[env.staging.r2_buckets]]
binding = "DOCS_BUCKET"
bucket_name = "presalesmx-docs-staging"

[[env.staging.secrets_store_secrets]]
binding = "RESEND_API_KEY"
store_id = "f63b63e25881480bb743023201203a6a"
secret_name = "RESEND_API_KEY"

[[env.staging.secrets_store_secrets]]
binding = "DELFOS_API_TOKEN"
store_id = "f63b63e25881480bb743023201203a6a"
secret_name = "DELFOS_API_TOKEN"

[[env.staging.secrets_store_secrets]]
binding = "HUBSPOT_ACCESS_TOKEN"
store_id = "f63b63e25881480bb743023201203a6a"
secret_name = "HUBSPOT_ACCESS_TOKEN"

